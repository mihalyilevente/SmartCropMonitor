services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - HASKELL_SERVICE_URL=http://haskell-service:8081/field-stats
      - SQLALCHEMY_DATABASE_URL=${SQLALCHEMY_DATABASE_URL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WRF_OUTPUT_DIR=/app/shared/wrf_output
      - COMPOSE_FILE_HOST=/root/SmartCropMonitor/docker-compose.yml
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-smartcropmonitor}
    volumes:
      - ./backend/data:/app/data
      - wrf_shared_exchange:/app/shared
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/root/SmartCropMonitor/docker-compose.yml:ro
    depends_on:
      - haskell-service
    restart: unless-stopped

  haskell-service:
    build: ./haskell-service
    ports:
      - "8081:8081"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://46.225.7.134:8000
        - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN}
    container_name: smartcrop_frontend
    ports:
      - "3000:80"
    restart: unless-stopped

  wrf-preprocessor:
    build:
      context: ./wrf-preprocessor
      dockerfile: Dockerfile
    environment:
      - WRF_CENTER_LAT=${WRF_CENTER_LAT:-0}
      - WRF_CENTER_LON=${WRF_CENTER_LON:-0}
      - WRF_LOCATION_ID=${WRF_LOCATION_ID:-0}
      - GFS_FORECAST_HOURS=48
      - GFS_INTERVAL_HOURS=3
      - GRIB_INPUT_DIR=/app/shared/grib_input
      - SHARED_DIR=/app/shared
      - NAMELIST_WPS_PATH=/app/WPS/namelist.wps
      - WEBHOOK_URL=${WEBHOOK_URL}
    volumes:
      - /mnt/volume-nbg1-2/topo:/app/backend/data/storage/topo:ro
      - wrf_shared_exchange:/app/shared
    restart: "no"
    profiles:
      - wrf

  wrf-runner:
    build:
      context: ./wrf-runner
      dockerfile: Dockerfile
    environment:
      - SHARED_DIR=/app/shared
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WRF_LOCATION_ID=${WRF_LOCATION_ID:-0}
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 3G
    volumes:
      - wrf_shared_exchange:/app/shared
      - wrf_shared_exchange:/app/WRF/test/em_real/input_data
    restart: "no"
    profiles:
      - wrf

volumes:
  wrf_shared_exchange: